<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Noticias - VONA RTV</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;500;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        /* DISEÑO DE LOS RECUADROS INDEPENDIENTES */
        .news-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 30px;
            padding: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .news-card {
            background: rgba(20, 20, 20, 0.8); 
            border: 1px solid rgba(255, 255, 255, 0.1); 
            border-radius: 12px; 
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6); 
            display: flex;
            flex-direction: column;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            cursor: pointer; /* Cambia el cursor a una manito para indicar que se puede hacer clic */
        }

        .news-card:hover {
            transform: translateY(-5px); 
            box-shadow: 0 15px 35px rgba(255, 255, 255, 0.1); /* Efecto de brillo al pasar el mouse */
        }

        .news-card img, .news-card video {
            width: 100%;
            height: 220px;
            object-fit: cover;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            background: #000;
        }

        .audio-container {
            padding: 20px;
            background: rgba(0, 0, 0, 0.6);
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .audio-container audio {
            width: 100%;
        }

        .news-content {
            padding: 25px; 
        }

        .news-date {
            color: var(--accent-1, #f39c12); 
            font-size: 0.85rem;
            font-weight: 800;
            text-transform: uppercase;
            margin-bottom: 10px;
            display: block;
            letter-spacing: 1px;
        }

        .news-content h2 {
            font-size: 1.4rem;
            color: #ffffff;
            margin: 0 0 15px 0;
            line-height: 1.3;
        }

        /* En la tarjeta pequeña, limitamos el texto a 3 líneas */
        .news-content p {
            color: #cccccc;
            font-size: 0.95rem;
            line-height: 1.6;
            margin: 0;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        /* =========================================
           DISEÑO DE LA VENTANA EMERGENTE (MODAL)
           ========================================= */
        .modal-overlay {
            display: none; /* Oculto por defecto */
            position: fixed;
            z-index: 9999;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.85); /* Fondo oscuro transparente */
            backdrop-filter: blur(8px); /* Desenfoca el fondo */
            overflow-y: auto; /* Permite hacer scroll si la noticia es muy larga */
        }

        .modal-content {
            background: #111;
            margin: 5% auto; /* Centrado con margen arriba */
            padding: 40px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            width: 90%;
            max-width: 800px;
            position: relative;
            box-shadow: 0 20px 50px rgba(0,0,0,0.9);
            animation: fadeIn 0.3s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .close-btn {
            position: absolute;
            top: 15px;
            right: 25px;
            color: #aaa;
            font-size: 35px;
            font-weight: bold;
            cursor: pointer;
            transition: color 0.3s;
        }

        .close-btn:hover {
            color: #fff;
        }

        .modal-media img, .modal-media video {
            width: 100%;
            max-height: 450px;
            object-fit: contain; /* Para que la foto completa se vea sin cortarse */
            border-radius: 8px;
            margin-bottom: 25px;
            background: #000;
        }

        .modal-body {
            color: #ddd;
            font-size: 1.1rem;
            line-height: 1.8;
            white-space: pre-wrap; /* Respeta los saltos de línea que hagas en el panel admin */
        }
    </style>
</head>
<body>
    <div class="bg-glow bg-glow-1"></div>
    <div class="bg-glow bg-glow-2"></div>

    <header>
        <div class="logo">
            <a href="index.html" style="display: flex; align-items: center; gap: 15px; text-decoration: none; color: inherit;">
                <img src="logo.png" alt="Logo VONA RTV" class="logo-icon"> VONA <span>RTV</span>
            </a>
        </div>
        
        <nav class="main-nav">
            <a href="index.html" class="nav-link">Inicio</a>
            <a href="noticias.html" class="nav-link active">Noticias</a>
            <a href="admin.html" class="nav-link">Iniciar Sesión</a>
        </nav>

        <div class="live-badge">
            <span class="dot"></span> EN VIVO
        </div>
    </header>

    <main class="news-main">
        <section class="news-header" style="text-align: center; margin-bottom: 40px; margin-top: 100px;">
            <h1 style="font-size: 2.5rem;">Últimas <span class="gradient-text">Noticias</span></h1>
            <p style="color: var(--text-muted);">Entérate de los acontecimientos más importantes, exclusivas y novedades musicales.</p>
        </section>

        <!-- Cuadrícula donde aparecerán los recuadros -->
        <div class="news-grid" id="news-container">
            <!-- Las noticias aparecerán aquí -->
        </div>
    </main>

    <!-- EL MODAL (VENTANA EMERGENTE PARA NOTICIA EXPANDIDA) -->
    <div id="news-modal" class="modal-overlay">
        <div class="modal-content">
            <span class="close-btn" onclick="cerrarNoticia()">&times;</span>
            <div id="modal-media" class="modal-media"></div>
            <span id="modal-date" class="news-date"></span>
            <h2 id="modal-title" style="color: #fff; font-size: 2rem; margin-bottom: 20px;"></h2>
            <div id="modal-desc" class="modal-body"></div>
        </div>
    </div>

    <footer>
        <div class="footer-content">
            <div class="quote-container">
                <p class="motivational-quote">"El volumen de la música refleja la intensidad de tus sueños. Sube el volumen, no te rindas y haz que el mundo te escuche."</p>
            </div>
            
            <a href="https://wa.me/593983718659" class="whatsapp-btn" target="_blank" rel="noopener noreferrer">
                <svg viewBox="0 0 32 32" class="wa-icon" fill="currentColor">
                    <path d="M16 0c-8.837 0-16 7.163-16 16 0 2.825 0.737 5.481 2.050 7.781l-2.050 8.219 8.419-2.206c2.256 1.188 4.831 1.863 7.581 1.863 8.837 0 16-7.163 16-16s-7.163-16-16-16zM16 29.256c-2.481 0-4.819-0.65-6.894-1.787l-0.494-0.294-5.112 1.344 1.363-5-0.325-0.519c-1.256-2.031-1.95-4.425-1.95-6.969 0-7.319 5.956-13.275 13.275-13.275s13.275 5.956 13.275 13.275-5.956 13.275-13.275 13.275zM23.363 19.344c-0.406-0.206-2.406-1.188-2.781-1.325-0.375-0.131-0.644-0.206-0.919 0.206-0.275 0.406-1.050 1.325-1.288 1.594-0.238 0.275-0.475 0.306-0.881 0.106-0.406-0.206-1.719-0.638-3.275-2.031-1.213-1.088-2.031-2.431-2.269-2.837-0.238-0.406-0.025-0.625 0.181-0.831 0.181-0.181 0.406-0.475 0.613-0.712 0.206-0.238 0.275-0.406 0.406-0.681 0.131-0.275 0.069-0.519-0.031-0.712-0.106-0.206-0.919-2.219-1.256-3.037-0.331-0.8-0.669-0.694-0.919-0.706-0.238-0.013-0.512-0.013-0.787-0.013-0.275 0-0.719 0.106-1.094 0.512-0.375 0.406-1.431 1.4-1.431 3.413s1.469 3.956 1.669 4.225c0.206 0.275 2.881 4.4 6.981 6.169 0.975 0.419 1.738 0.669 2.331 0.856 0.981 0.313 1.875 0.269 2.581 0.163 0.794-0.119 2.406-0.981 2.744-1.931 0.338-0.95 0.338-1.763 0.238-1.931-0.1-0.169-0.375-0.275-0.781-0.481z"></path>
                </svg>
                Pide tu canción
            </a>
        </div>
    </footer>

    <script>
        const contenedor = document.getElementById('news-container');
        const noticias = JSON.parse(localStorage.getItem('mis_noticias')) || [];

        if (noticias.length === 0) {
            contenedor.innerHTML = `<p style="color: rgba(255,255,255,0.5); text-align: center; font-size: 1.1rem; grid-column: 1/-1;">Muy pronto publicaremos nuevas noticias. ¡Mantente atento!</p>`;
        } else {
            noticias.forEach((noticia, index) => {
                const tarjeta = document.createElement('article');
                tarjeta.className = 'news-card';
                // Al hacer clic en la tarjeta, abre la función con el índice de la noticia
                tarjeta.onclick = function() { abrirNoticia(index); };
                
                let mediaHtml = ``;

                if (noticia.media) {
                    if (noticia.tipo && noticia.tipo.startsWith('video')) {
                        mediaHtml = `<video><source src="${noticia.media}" type="${noticia.tipo}"></video>`;
                    } else if (noticia.tipo && noticia.tipo.startsWith('audio')) {
                        mediaHtml = `
                            <div class="audio-container">
                                <audio controls>
                                    <source src="${noticia.media}" type="${noticia.tipo}">
                                </audio>
                            </div>
                        `;
                    } else {
                        mediaHtml = `<img src="${noticia.media}" alt="${noticia.titulo}">`;
                    }
                }

                tarjeta.innerHTML = `
                    ${mediaHtml}
                    <div class="news-content">
                        <span class="news-date">${noticia.fecha}</span>
                        <h2>${noticia.titulo}</h2>
                        <p>${noticia.desc}</p>
                    </div>
                `;
                contenedor.appendChild(tarjeta);
            });
        }

        // FUNCIÓN PARA ABRIR LA NOTICIA EN GRANDE
        function abrirNoticia(index) {
            const noticia = noticias[index];
            const modal = document.getElementById('news-modal');
            const mediaContenedor = document.getElementById('modal-media');
            
            // Llenar textos
            document.getElementById('modal-title').innerText = noticia.titulo;
            document.getElementById('modal-date').innerText = noticia.fecha;
            document.getElementById('modal-desc').innerText = noticia.desc;

            // Llenar multimedia (Agregamos "controls" a los videos para que se puedan reproducir aquí)
            mediaContenedor.innerHTML = '';
            if (noticia.media) {
                if (noticia.tipo && noticia.tipo.startsWith('video')) {
                    mediaContenedor.innerHTML = `<video controls autoplay><source src="${noticia.media}" type="${noticia.tipo}"></video>`;
                } else if (noticia.tipo && noticia.tipo.startsWith('audio')) {
                    mediaContenedor.innerHTML = `
                        <div class="audio-container" style="border-radius: 8px; margin-bottom: 25px;">
                            <audio controls autoplay>
                                <source src="${noticia.media}" type="${noticia.tipo}">
                            </audio>
                        </div>
                    `;
                } else {
                    mediaContenedor.innerHTML = `<img src="${noticia.media}" alt="${noticia.titulo}">`;
                }
            }

            // Mostrar la ventana
            modal.style.display = 'block';
            
            // Bloquear el scroll del fondo
            document.body.style.overflow = 'hidden';
        }

        // FUNCIÓN PARA CERRAR LA NOTICIA
        function cerrarNoticia() {
            const modal = document.getElementById('news-modal');
            modal.style.display = 'none';
            
            // Vaciar multimedia para que el audio o video dejen de sonar de fondo
            document.getElementById('modal-media').innerHTML = '';
            
            // Reactivar el scroll del fondo
            document.body.style.overflow = 'auto';
        }

        // Cerrar la ventana si se hace clic afuera del recuadro negro
        window.onclick = function(event) {
            const modal = document.getElementById('news-modal');
            if (event.target === modal) {
                cerrarNoticia();
            }
        }
    </script>
</body>
</html>
